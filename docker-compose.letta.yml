# Drop-in service that adds the planner Letta gateway to the existing Letta stack on KVM4.
#
# Deploy (from this repo on the server):
#   LETTA_SERVER_PASSWORD=... docker compose -f docker-compose.letta.yml up -d --build
#
# The gateway talks to the Letta server over the stack's internal network (service name
# `letta`, port 8283). Adjust `networks` to your actual Letta compose network name
# (commonly `letta_stack` or `letta_letta_stack` — check `docker network ls`).
services:
  planner-gateway:
    build: ./gateway
    container_name: planner-gateway
    restart: unless-stopped
    environment:
      GATEWAY_BIND_HOST: "0.0.0.0"
      GATEWAY_BIND_PORT: "8800"
      GATEWAY_LETTA_BASE_URL: "http://letta:8283"
      GATEWAY_LETTA_TOKEN: "${LETTA_SERVER_PASSWORD:-letta-master-key}"
      # Agent IDs default to the provisioned planner agents; override here if they change.
      # GATEWAY_AGENT_WEEKLY_REPORT: "agent-c783d24a-9d85-4b0b-8882-e210f504504a"
      # GATEWAY_AGENT_NEXT_WEEK_PLAN: "agent-815929b3-8ffb-4671-992b-ee7d55273f24"
      # GATEWAY_AGENT_TASK_REWRITE: "agent-e8518fbc-29a2-4585-8ba8-7cb45a936a18"
      # GATEWAY_AGENT_EXECUTIVE_ANALYTICS: "agent-e72faed9-38f8-4808-9dde-2fac12038f22"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8800/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8800:8800"   # planner_api reaches it at http://127.0.0.1:8800
    networks:
      - letta_stack

networks:
  letta_stack:
    external: true
