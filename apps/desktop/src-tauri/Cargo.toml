[package]
name = "coqgen-desktop"
version = "0.1.0"
description = "COQ_GEN desktop shell (Tauri) — spawns and supervises the Core API sidecar."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
