name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coqgen
          POSTGRES_PASSWORD: coqgen
          POSTGRES_DB: coqgen_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coqgen" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      COQGEN_DATABASE_URL: postgresql+psycopg://coqgen:coqgen@127.0.0.1:5432/coqgen_dev
      PGPASSWORD: coqgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt openapi-spec-validator
          pip install -e packages/schemas -e services/core_api -e services/gateway

      - name: SQL schema + smoke checks
        run: |
          psql -h 127.0.0.1 -U coqgen -d coqgen_dev -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h 127.0.0.1 -U coqgen -d coqgen_dev -v ON_ERROR_STOP=1 -f tests/smoke.sql

      - name: Alembic baseline on a fresh DB
        run: |
          createdb -h 127.0.0.1 -U coqgen coqgen_mig
          COQGEN_DATABASE_URL=postgresql+psycopg://coqgen:coqgen@127.0.0.1:5432/coqgen_mig \
            bash -c 'cd db && alembic upgrade head'

      - name: OpenAPI contract validation
        run: python tests/validate_openapi.py

      - name: Python unit tests
        run: pytest -q services/core_api/tests

      - name: Lint
        run: ruff check services packages

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Type-check + build UI
        working-directory: apps/desktop
        run: |
          npm install
          npm run build
