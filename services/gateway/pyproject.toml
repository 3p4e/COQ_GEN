[project]
name = "coqgen-gateway"
version = "0.1.0"
description = "COQ_GEN Letta agent gateway (FastAPI on KVM4): auth, routing, schema validation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coqgen_gateway*"]
