openapi: 3.1.0
info:
  title: COQ_GEN Agent Gateway (KVM4)
  version: 0.1.0
  description: >
    FastAPI facade in front of the dedicated Letta stateful agents on KVM4.
    This is the ONLY surface the COQ_GEN desktop app uses to reach Letta.
    The gateway authenticates (mTLS + bearer), routes stable logical endpoints to
    concrete agent IDs via an allow-list route map (only SUITABLE agents are reachable),
    validates request/response JSON against versioned schemas, applies
    timeouts/retries/circuit-breaking, and performs agent-memory write-back.
    See docs/05_LETTA_AGENT_INTEGRATION.md.
servers:
  - url: https://kvm4.internal/coqgen-gateway/v1
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness + reachability of mapped (suitable) agents
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  agents:
                    type: object
                    additionalProperties: { type: string, enum: [up, down] }

  /agents/coa-ingestion/classify:
    post:
      summary: Classify an eCOA document (CoA Ingestion Agent)
      operationId: classifyDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassifyRequest" }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassifyResponse" }
        "422": { $ref: "#/components/responses/SchemaError" }
        "502": { $ref: "#/components/responses/AgentError" }

  /agents/parameter-extraction/extract:
    post:
      summary: Extract structured parameter rows (Parameter Extraction Agent)
      operationId: extractParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractRequest" }
      responses:
        "200":
          description: Extracted parameter rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractResponse" }
        "422": { $ref: "#/components/responses/SchemaError" }
        "502": { $ref: "#/components/responses/AgentError" }

  /agents/coq-assembly/match:
    post:
      summary: Semantically match parameters to the active spec (CoQ Assembly Agent)
      operationId: matchToSpec
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: Matched lines + gaps + narrative (validated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResponse" }
        "422": { $ref: "#/components/responses/SchemaError" }
        "502": { $ref: "#/components/responses/AgentError" }

  /agents/compliance/assess:
    post:
      summary: Per-parameter pass/fail + OOS detection (Compliance Analysis Agent)
      operationId: assessCompliance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchResponse" }
      responses:
        "200":
          description: Compliance assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResponse" }

  /agents/ocr-escalation/read:
    post:
      summary: Vision OCR for degraded scans (warehouse_quarantine_ocr_agent, gpt-4o)
      operationId: ocrEscalate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_image_b64]
              properties:
                page_image_b64: { type: string, description: base64 PNG of the page }
                language_hint: { type: string, example: mk }
      responses:
        "200":
          description: Recognised text + confidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  confidence: { type: number }

  /memory/writeback:
    post:
      summary: Persist an analyst correction to the relevant agent's archival memory
      description: >
        Called after the correction is committed to the relational store (the record of truth).
        Closes the RAAG learning loop. Idempotent on (agent, canonical_key, lab, term).
      operationId: memoryWriteback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryWriteback" }
      responses:
        "202": { description: Accepted (queued if KVM4 busy) }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  responses:
    SchemaError:
      description: Agent output failed schema validation; not staged
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AgentError:
      description: Upstream agent error / timeout (circuit-breaker may be open)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    Provenance:
      type: object
      properties:
        page: { type: integer }
        bbox:
          type: object
          properties:
            x0: { type: number }
            y0: { type: number }
            x1: { type: number }
            y1: { type: number }
        confidence: { type: number, minimum: 0, maximum: 1 }
        asserted_by_agent: { type: string }
        asserted_by_model: { type: string }

    ClassifyRequest:
      type: object
      required: [document_text, top_chunks]
      properties:
        source_file_sha256: { type: string }
        document_text: { type: string }
        top_chunks:
          type: array
          items: { type: string }
        batch_hint: { type: string }

    ClassifyResponse:
      type: object
      required: [doc_type, extraction_confidence]
      properties:
        doc_type: { type: string, enum: [cannabis_coa, water_quality, other] }
        source_lab: { type: string, example: LT-083 }
        batch_numbers: { type: array, items: { type: string } }
        strain_names: { type: array, items: { type: string } }
        issue_date: { type: string, format: date }
        analysis_date: { type: string, format: date }
        sampling_date: { type: string, format: date }
        page_count: { type: integer }
        extraction_confidence: { type: number }

    ExtractRequest:
      type: object
      required: [ecoa_document_id, sections]
      properties:
        ecoa_document_id: { type: string, format: uuid }
        source_lab: { type: string }
        language: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              content: { type: string }
              page: { type: integer }

    ExtractedParameter:
      type: object
      required: [printed_param_name]
      properties:
        printed_param_name: { type: string }
        method: { type: string }
        acceptance_text: { type: string }
        result_value: { type: string }
        result_text: { type: string }
        unit: { type: string }
        result_qualifier: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }

    ExtractResponse:
      type: object
      properties:
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ExtractedParameter" }

    MatchRequest:
      type: object
      required: [production_batch_id, spec_reference, ecoa_parameters]
      properties:
        production_batch_id: { type: string, format: uuid }
        spec_reference: { type: string, example: "QCSP-IMB-001 v02" }
        ecoa_parameters:
          type: array
          items:
            type: object
            properties:
              ecoa_parameter_id: { type: string, format: uuid }
              printed_param_name: { type: string }
              method: { type: string }
              result_text: { type: string }
              unit: { type: string }
              source_lab: { type: string }
              source_document_code: { type: string }
              source_document_date: { type: string, format: date }
              confidence: { type: number }
        retrieval_context:
          type: object
          description: synonyms + prior corrections the gateway pre-fetched
          additionalProperties: true

    MatchedLine:
      type: object
      properties:
        spec_param_name: { type: string }
        matched_param_name: { type: string }
        canonical_key: { type: string }
        result_value: { type: string }
        unit: { type: string }
        status: { type: string, enum: [pass, fail, pending] }
        confidence: { type: number }
        source_lab: { type: string }
        source_ecoa: { type: string }
        source_ecoa_date: { type: string, format: date }
        reasoning: { type: string }

    MatchResponse:
      type: object
      required: [spec_reference, matched_lines, confidence_score]
      properties:
        coq_number:
          type: string
          description: ADVISORY ONLY. Authoritative number is allocated transactionally by the app.
        spec_reference: { type: string }
        matched_lines:
          type: array
          items: { $ref: "#/components/schemas/MatchedLine" }
        unmatched_specs:
          type: array
          items: { type: string }
        compliance_summary: { type: string }
        confidence_score: { type: number }
        register_entry:
          type: object
          properties:
            cert_type: { type: string, example: CoQ }
            batch: { type: string }
            product_name: { type: string }
            prepared_by: { type: string }
            reviewed_by: { type: string }

    MemoryWriteback:
      type: object
      required: [agent, kind, payload]
      properties:
        agent: { type: string, example: coq-assembly }
        kind: { type: string, enum: [synonym, correction, oos_pattern] }
        payload:
          type: object
          additionalProperties: true
