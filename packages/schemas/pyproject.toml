[project]
name = "coqgen-schemas"
version = "0.1.0"
description = "Shared Pydantic v2 contracts for COQ_GEN (source of truth for cross-boundary shapes)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coqgen_schemas*"]
